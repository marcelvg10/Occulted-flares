[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occulted-flares"
version = "0.1.0"
description = "Modular analysis of occulted solar flares with STIX and EUVI"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "sunpy[map,net]>=6,<9",
    "astropy>=6,<9",
    "numpy>=1.26,<3",
    "matplotlib>=3.8",
    "pandas>=2,<4",
    "scipy>=1.11",
    "requests>=2",
]

[project.optional-dependencies]
spectroscopy = [
    "sunkit-spex[legacy]==0.5.0",
]
notebooks = [
    "ipykernel>=6,<8",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    "ipympl>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
